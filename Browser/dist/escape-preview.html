<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1829 · Escape scene preview</title><link rel="stylesheet" href="./style.css"><style>#previewNav{position:fixed;left:24px;top:24px;z-index:31;font:10px Arial;letter-spacing:2px;color:#e4e8db;text-shadow:0 2px 6px #000}#previewNav a{color:inherit}#replay{position:fixed;right:24px;top:24px;z-index:32;background:#17211ae8;padding:14px 20px;border:1px solid #bdcc98}</style></head>
<body><canvas id="game" aria-label="Aerial 3D view of the 1829 estate"></canvas>
<div id="previewNav"><a href="./">← BACK TO GAME</a> · <a href="?view=front">FRONT DETAIL</a> · <a href="?view=tower">WATER TOWER</a> · <a href="./escape-preview.html">AERIAL VIEW</a> · <a href="./explore.html">EXPLORE THE ASYLUM ↗</a></div>
<section id="escapeCutscene" role="dialog" aria-modal="true" aria-labelledby="escapeCutsceneTitle" hidden><div class="escape-caption"><span>OUTSIDE. AT LAST.</span><h2 id="escapeCutsceneTitle">You escaped</h2><p>The 1829 building · Chester</p></div><button id="skipCutscene" type="button">SKIP CUTSCENE ↗</button></section>
<button id="replay" hidden>REPLAY CUTSCENE ↗</button>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {createEscapeExterior,loadEscapeFrontage} from './escape-exterior.mjs';
import {ESCAPE_WATER_TOWER} from './water-tower.mjs';
import {createEscapeCutscene} from './escape-cutscene.mjs';
import {EAST_PHOTO_VIEW} from './east-photo-detail.mjs';
import {COURTYARD_PHOTO_VIEW} from './courtyard-photo-detail.mjs';
import {REAR_COURT_PHOTO_VIEW} from './rear-court-photo-detail.mjs';
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const exterior=createEscapeExterior(THREE,innerWidth/innerHeight),replay=document.getElementById('replay'),clock=new THREE.Clock();
await loadEscapeFrontage(THREE,exterior);
const cutscene=createEscapeCutscene(document.getElementById('escapeCutscene'),()=>{replay.hidden=false;},{getCamera:()=>exterior.camera,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
function start(){replay.hidden=true;clock.getDelta();cutscene.start();}replay.onclick=start;
const view=new URLSearchParams(location.search).get('view'),frontDetail=view==='front',towerDetail=view==='tower',rightDetail=view==='right',photoDetail=['east-photo','courtyard-photo','rear-court-photo'].includes(view);
function framePhoto(){const shot=view==='rear-court-photo'?REAR_COURT_PHOTO_VIEW:view==='courtyard-photo'?COURTYARD_PHOTO_VIEW:EAST_PHOTO_VIEW;exterior.camera.position.set(...shot.position);exterior.camera.lookAt(...shot.target);exterior.camera.fov=shot.fov;exterior.camera.updateProjectionMatrix();}
function frameFront(){exterior.camera.position.set(0,10,19.8+34*Math.max(1,1/exterior.camera.aspect));exterior.camera.lookAt(0,9,19.8);}
function frameTower(){const {x,z}=ESCAPE_WATER_TOWER;exterior.camera.position.set(x+34,25,z+58*Math.max(1,1/exterior.camera.aspect));exterior.camera.lookAt(x,20,z);}
function frameRight(){exterior.camera.position.set(72,28,108*Math.max(1,1/exterior.camera.aspect));exterior.camera.lookAt(72,9,0);}
if(photoDetail)framePhoto();else if(rightDetail)frameRight();else if(towerDetail)frameTower();else if(frontDetail)frameFront();else start();
function frame(){requestAnimationFrame(frame);const dt=clock.getDelta();if(!document.hidden)cutscene.update(dt);renderer.render(exterior.scene,exterior.camera);}frame();
document.addEventListener('visibilitychange',()=>clock.getDelta());
addEventListener('keydown',e=>{if(['Escape','Space','Enter'].includes(e.code)&&cutscene.active){e.preventDefault();cutscene.skip();}});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);exterior.camera.aspect=innerWidth/innerHeight;exterior.camera.updateProjectionMatrix();if(photoDetail)framePhoto();else if(rightDetail)frameRight();else if(towerDetail)frameTower();else if(frontDetail)frameFront();else cutscene.resize();});
</script></body></html>
