name: Build Windows game and Store package

on:
  push:
    branches: [main]
    paths: ['Browser/**', 'Desktop/**', '.github/workflows/windows-store.yml']
  pull_request:
    branches: [main]
    paths: ['Browser/**', 'Desktop/**', '.github/workflows/windows-store.yml']
  workflow_dispatch:
    inputs:
      package_kind:
        description: 'Store for Partner Center upload; preview is only for local testing'
        type: choice
        options: [preview, store]
        default: preview

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    # Leave time for worker-built interiors and the packaged offline smoke
    # after software-rendered timeline validation.
    timeout-minutes: 60
    env:
      electron_config_cache: ${{ github.workspace }}/Desktop/.cache/electron
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            Browser/package-lock.json
            Desktop/package-lock.json
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('Desktop/package-lock.json') }}
      - name: Install browser tools
        run: npm ci --prefix Browser
      - name: Install desktop tools
        run: npm ci --prefix Desktop
      - name: Install model compiler browser
        working-directory: Browser
        run: npx playwright install chromium
      - name: Check desktop packaging boundaries and Store metadata
        run: npm test --prefix Desktop
      - name: Check shared model source
        run: npm run test:models --prefix Browser
      - name: Build shared web assets
        env:
          BROWSER_CI_SOFTWARE: '1'
        run: npm run build:models --prefix Browser
      - name: Check compiled scene and timeline
        env:
          BROWSER_CI_SOFTWARE: '1'
          INTERIOR_LOADING_ARTIFACT_DIR: ./artifacts/ci-interior-loading/
          TIMELINE_ARTIFACT_DIR: ./artifacts/ci-timeline/
        run: npm run test:compiled --prefix Browser
      - name: Upload model test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-model-test-evidence
          path: |
            Browser/artifacts/ci-interior-loading/
            Browser/artifacts/ci-timeline/
          if-no-files-found: ignore
      - name: Set up Microsoft packaging tools
        run: ./Desktop/scripts/setup-sdk.ps1
      - name: Package Windows game
        working-directory: Desktop
        env:
          PACKAGE_KIND: ${{ inputs.package_kind || 'preview' }}
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if ($env:PACKAGE_KIND -eq 'store') {
            npm run package:store
          } else {
            npm run package:preview
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged game offline
        working-directory: Desktop
        env:
          BROWSER_CI_SOFTWARE: '1'
        run: npm run test:desktop -- --packaged
      - name: Upload runnable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: EscapeFrom1829-Windows-x64
          path: Desktop/out/EscapeFrom1829-win32-x64/
          if-no-files-found: error
      - name: Upload MSIX directly for download
        id: msix
        uses: actions/upload-artifact@v7
        with:
          path: Desktop/out/*.msix
          archive: false
          if-no-files-found: error
      - name: Explain package download and Store submission
        env:
          PACKAGE_KIND: ${{ inputs.package_kind || 'preview' }}
          MSIX_URL: ${{ steps.msix.outputs.artifact-url }}
        run: |
          "Download the [.msix package]($env:MSIX_URL) directly from this run's Artifacts. The Windows folder ZIP is for local play." >> $env:GITHUB_STEP_SUMMARY
          if ($env:PACKAGE_KIND -eq 'store') {
            "Upload the file ending in -store.msix to the Packages page in Partner Center." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "This is a preview package and cannot be submitted to the Store. For submission, configure STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME repository variables, then use Run workflow with package_kind set to store." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload desktop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-evidence
          path: |
            Desktop/out/web-build.json
            Desktop/artifacts/*.png
            Desktop/artifacts/*.json
            Desktop/artifacts/*.log
          if-no-files-found: ignore
